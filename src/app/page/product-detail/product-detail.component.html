<div *ngIf="product" class="flex justify-center items-center mt-10">
    <div class="bg-white shadow-lg rounded-lg overflow-hidden max-w-2xl flex p-6">
      <!-- Hình ảnh sản phẩm -->
      <div class="w-1/3">
        <img [src]="product.image" alt="{{ product.name }}" class="w-full rounded-lg object-cover" />
      </div>
  
      <!-- Thông tin sản phẩm -->
      <div class="w-2/3 pl-6">
        <h2 class="text-2xl font-bold text-gray-800">{{ product.name }}</h2>
        <p class="text-lg font-semibold text-red-500 mt-2">💰 Giá: {{ product.price | currency:'VND' }}</p>
        <p class="text-lg font-semibold text-green-500 mt-1">⚡ Giá khuyến mãi: {{ product.sale_price | currency:'VND' }}</p>
        <p class="text-gray-600 mt-2"><strong>📂 Danh mục:</strong> {{ product.category }}</p>
        <p class="text-gray-600"><strong>📦 Trạng thái:</strong> {{ product.status }}</p>
        <p class="text-yellow-500 mt-2"><strong>⭐ Đánh giá:</strong> {{ product.rating }}/5</p>
  
        <!-- Nút thêm vào giỏ hàng -->
        <button (click)="addToCart()" 
          class="mt-4 px-6 py-2 bg-blue-600 text-white text-lg font-semibold rounded-lg shadow-md hover:bg-blue-700 transition">
          🛒 Thêm vào giỏ hàng
        </button>
      </div>
    </div>
  </div>
  
  <!-- Hiển thị khi không tìm thấy sản phẩm -->
  <div *ngIf="!product" class="text-center text-red-500 text-lg mt-10">
    ❌ Không tìm thấy sản phẩm.
  </div>
