<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 p-4">
  <div 
    class="border rounded-lg shadow-md p-4 bg-white hover:shadow-lg transition"
    *ngFor="let item of products; let i = index"
  >
    <img 
      [src]="item.image" 
      [alt]="item.name" 
      class="w-full h-40 object-cover rounded-md"
    />
    <h3 class="text-lg font-semibold mt-2">{{ item.name }}</h3>
    <p class="text-gray-600">{{ item.price | currency:'VND' }}</p>
    <a 
      [routerLink]="['/product', item.id]" 
      class="block mt-2 text-center bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition"
    >
      Xem chi tiết
    </a>
  </div>
</div>
