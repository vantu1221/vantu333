<div class="max-w-5xl mx-auto p-6 bg-white shadow-md rounded-lg">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-2xl font-bold">Danh sách sản phẩm</h2>
      <!-- 🛠 Nút thêm sản phẩm -->
      <button (click)="addProduct()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
        + Thêm sản phẩm
      </button>
    </div>
  
    <table class="min-w-full bg-white shadow-md rounded">
      <thead>
        <tr class="bg-gray-200 text-gray-700">
          <th class="p-3">Tên</th>
          <th class="p-3">Giá</th>
          <th class="p-3">Hình ảnh</th>
          <th class="p-3">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products" class="border-b">
          <td class="p-3">{{ product.name }}</td>
          <td class="p-3">{{ product.price | currency }}</td>
          <td class="p-3">
            <img [src]="product.image" alt="{{ product.name }}" class="w-16 h-16 object-cover rounded">
          </td>
          <td class="p-3 flex space-x-2">
            <!-- Nút Sửa -->
            <button (click)="editProduct(product.id)" class="px-4 py-2 bg-blue-500 text-white rounded">Sửa</button>
            
            <!-- Nút Xóa -->
            <button (click)="deleteProduct(product.id)" class="px-4 py-2 bg-red-500 text-white rounded">Xóa</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
